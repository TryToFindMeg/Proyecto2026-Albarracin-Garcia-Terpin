name: Publicar RetroWave en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - primera-entrega/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos de la primera entrega
        uses: actions/upload-pages-artifact@v3
        with:
          path: primera-entrega
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
