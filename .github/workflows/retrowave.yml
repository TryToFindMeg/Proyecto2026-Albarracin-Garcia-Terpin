name: Revisar y publicar RetroWave

on:
  pull_request:
    paths:
      - "segunda-entrega/**"
      - "primera-entrega/**"
      - "README.md"
      - ".github/workflows/retrowave.yml"
  push:
    branches: [main]
    paths:
      - "segunda-entrega/**"
      - "primera-entrega/**"
      - "README.md"
      - ".github/workflows/retrowave.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: segunda-entrega
    env:
      VITE_API_URL: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: segunda-entrega/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=low
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          path: segunda-entrega/dist

  publicar:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: revisar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Publicar
        id: publicacion
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
